<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>온라인 학생 자기소개서</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- JSX 변환용 Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>

  <!-- 프리미엄 웹 폰트 (Pretendard) 적용 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background-color: #f8fafc;
    }
    .smooth-scroll { -webkit-overflow-scrolling: touch; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 부드러운 화면 전환 애니메이션 */
    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    /* 입력창 포커스 시 부드러운 전환 */
    input, textarea { transition: all 0.2s ease-in-out; }
  </style>
</head>
<body class="text-slate-800 selection:bg-indigo-200 selection:text-indigo-900">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    window.firebase = {
      initializeApp, getAuth, signInAnonymously, onAuthStateChanged,
      getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, setDoc
    };
  </script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    // ==========================================
    // 선생님의 파이어베이스 설정값 (기존과 동일)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDJn9xK5-G24FwEb0WS6ee_F1tGSHDiMck",
      authDomain: "myclassintro-6f655.firebaseapp.com",
      projectId: "myclassintro-6f655",
      storageBucket: "myclassintro-6f655.firebasestorage.app",
      messagingSenderId: "259672650671",
      appId: "1:259672650671:web:f3cdb2695062229c89f55a"
    };

    let app, auth, db;
    try {
      app = window.firebase.initializeApp(firebaseConfig);
      auth = window.firebase.getAuth(app);
      db = window.firebase.getFirestore(app);
    } catch (error) {
      console.error("Firebase 초기화 오류:", error);
    }

    const formatPhoneNumberDisplay = (text) => {
      if (typeof text !== 'string') return text;
      if (!text) return "";
      const phoneRegex = /(01[016789])[- .]?([0-9]{3,4})[- .]?([0-9]{4})/g;
      return text.replace(phoneRegex, (match, p1, p2, p3) => `${p1}-${p2}-${p3} / ${p1}${p2}${p3}`);
    };

    const formatEmergencyContact = (text, studentName) => {
      if (typeof text !== 'string' || !text) return "";
      let formatted = formatPhoneNumberDisplay(text);
      if (studentName && !formatted.includes(studentName)) {
        formatted = formatted.replace(/(어머니|엄마|아버지|아빠|할머니|할아버지|형|누나|오빠|언니)/g, `${studentName} $1`);
      }
      return formatted;
    };

    const extractPhoneAndText = (text, studentName) => {
      if (typeof text !== 'string' || !text) return { phoneHyphen: "미작성", phoneNoHyphen: "미작성", relation: "" };
      const phoneRegex = /(01[016789])[- .]?([0-9]{3,4})[- .]?([0-9]{4})/g;
      let hyphenArr = [], noHyphenArr = [];
      let textPart = text.replace(phoneRegex, (match, p1, p2, p3) => {
        hyphenArr.push(`${p1}-${p2}-${p3}`);
        noHyphenArr.push(`${p1}${p2}${p3}`);
        return '';
      });
      let relationStr = textPart.replace(/[()\[\]]/g, '').trim();
      if (studentName && relationStr) {
        relationStr = relationStr.replace(/(어머니|엄마|아버지|아빠|할머니|할아버지|형|누나|오빠|언니)/g, `${studentName} $1`);
      }
      return { 
        phoneHyphen: hyphenArr.length > 0 ? hyphenArr.join(', ') : "번호 없음", 
        phoneNoHyphen: noHyphenArr.length > 0 ? noHyphenArr.join(', ') : "번호 없음", 
        relation: relationStr 
      };
    };

    const FORM_FIELDS = [
      { id: 'name', label: '이름', category: '인적사항', placeholder: '홍길동', type: 'text' },
      { id: 'contact', label: '내 연락처 (휴대폰)', category: '인적사항', placeholder: '010-0000-0000', type: 'text' },
      { id: 'emergency', label: '보호자 연락처 (비상연락망)', category: '인적사항', placeholder: '010-0000-0000 (어머니)', type: 'text' },
      { id: 'friends', label: '교우 관계 (희망 짝꿍 / 피하고 싶은 친구)', category: '인적사항', placeholder: '우리 반에 친한 친구가 있는지, 혹은 꼭 떨어져 앉고 싶은 친구가 있다면 살짝 적어주세요. (비밀보장)', type: 'textarea' },
      { id: 'family', label: '가족 관계 및 가정 분위기', category: '가정환경', placeholder: '가족 구성원, 부모님과의 친밀도, 집안 분위기 등을 자유롭게 적어주세요.', type: 'textarea' },
      { id: 'support', label: '학교 생활 지원 필요 여부', category: '가정환경', placeholder: '학교 생활과 관련하여 선생님의 특별한 배려나 지원(건강, 학습, 기타 등)이 필요한 부분이 있다면 편하게 적어주세요.', type: 'textarea' },
      { id: 'mbti', label: '나의 MBTI와 실제 성격', category: '자기이해', placeholder: 'MBTI가 무엇인가요? 본인이 생각하는 실제 성격과 비슷한가요?', type: 'text' },
      { id: 'strengths', label: '남보다 잘할 수 있는 것 (장점)', category: '자기이해', placeholder: '본인의 특기나 장점, 자랑거리를 적어주세요!', type: 'textarea' },
      { id: 'weaknesses', label: '정말 고치고 싶은 점 / 나의 고민', category: '자기이해', placeholder: '이것만은 고치고 싶다 하는 부분이나 요즘 가장 큰 고민은 무엇인가요?', type: 'textarea' },
      { id: 'health', label: '건강 상태 및 알레르기', category: '생활습관', placeholder: '수업 중 배려가 필요한 질환이나 급식 알레르기가 있다면 꼭 적어주세요.', type: 'textarea' },
      { id: 'study', label: '방과 후 학습 계획', category: '생활습관', placeholder: '하교 후 주로 어디서 공부하나요? (학원, 과외, 인강, 스터디카페, 야간자율학습 등)', type: 'textarea' },
      { id: 'club', label: '관심 있는 동아리 및 활동', category: '진로 및 학업', placeholder: '고등학교에서 가입하고 싶은 동아리나 관심 있는 활동 분야가 있나요?', type: 'textarea' },
      { id: 'future', label: '장래 희망과 희망 전공', category: '진로 및 학업', placeholder: '현재 생각하고 있는 희망 직업이나 대학교 전공이 있다면 적어주세요.', type: 'textarea' },
      { id: 'subjects', label: '좋아하는 / 어려워하는 과목', category: '진로 및 학업', placeholder: '좋아하는 과목과 이유, 특히 어려워하는 과목을 적어주세요.', type: 'textarea' },
      { id: 'toTeacher', label: '선생님께 바라는 점 / 기대하는 점', category: '소통', placeholder: '올해 우리 반이 이런 반이 되었으면 좋겠다, 담임 선생님께 바라는 점 등', type: 'textarea' },
      { id: 'secret', label: '선생님께만 털어놓는 비밀 이야기', category: '소통', placeholder: '선생님이 꼭 알았으면 하는 내용이나 개인적인 사정 (절대 비밀 보장)', type: 'textarea' }
    ];

    const CATEGORIES = ['인적사항', '가정환경', '자기이해', '생활습관', '진로 및 학업', '소통'];

    function App() {
      const [view, setView] = useState('select');
      const [students, setStudents] = useState([]);
      const [user, setUser] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [teacherPin, setTeacherPin] = useState('1234');
      const [subTeacherPin, setSubTeacherPin] = useState('');

      const currentUrl = typeof window !== 'undefined' ? window.location.href : 'https://example.com';

      useEffect(() => {
        if (!auth) return;
        
        window.firebase.signInAnonymously(auth).catch((error) => {
          if (error.code === 'auth/configuration-not-found' || error.code === 'auth/operation-not-allowed') {
            alert("🚨 파이어베이스 콘솔에서 '익명 로그인'을 켜주세요!");
          }
        });
        const unsubscribe = window.firebase.onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user || !db) return;
        
        const colRef = window.firebase.collection(db, 'student_introductions');
        const unsubscribe = window.firebase.onSnapshot(colRef, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          setStudents(data);
        }, (error) => {
          if (error.code === 'permission-denied') alert("데이터베이스 접근 권한이 막혀있습니다! 파이어베이스 규칙을 수정하세요.");
        });

        const settingsRef = window.firebase.doc(db, 'settings', 'app_settings');
        const unsubSettings = window.firebase.onSnapshot(settingsRef, (docSnap) => {
          if (docSnap.exists()) {
            if (docSnap.data().pin) setTeacherPin(docSnap.data().pin);
            if (docSnap.data().subPin) setSubTeacherPin(docSnap.data().subPin);
          }
        });
        
        return () => { unsubscribe(); unsubSettings(); };
      }, [user]);

      const handleStudentSubmit = async (data) => {
        if (!user || !db) return alert("데이터베이스 연결 오류");
        setIsSubmitting(true);
        try {
          const colRef = window.firebase.collection(db, 'student_introductions');
          await window.firebase.addDoc(colRef, { ...data, createdAt: Date.now(), userId: user.uid });
          setView('thankyou');
        } catch (error) {
          alert("저장 중 오류가 발생했습니다.");
        } finally {
          setIsSubmitting(false);
        }
      };

      if (!user) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-indigo-500 font-medium fade-in">
            <div className="animate-spin text-4xl mb-4 opacity-80">⏳</div>
            <p className="tracking-wide">데이터베이스 연결 중...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 fade-in">
          {view === 'select' && <RoleSelection setView={setView} teacherPin={teacherPin} subTeacherPin={subTeacherPin} />}
          {view === 'student' && <StudentForm onSubmit={handleStudentSubmit} onBack={() => setView('select')} isSubmitting={isSubmitting} />}
          {view === 'thankyou' && <ThankYouView onHome={() => setView('select')} />}
          {view === 'teacher' && <TeacherDashboard students={students} onBack={() => setView('select')} currentUrl={currentUrl} db={db} />}
        </div>
      );
    }

    // ==========================================
    // 역할 선택 화면 (세련된 카드 디자인 적용)
    // ==========================================
    function RoleSelection({ setView, teacherPin, subTeacherPin }) {
      const [showPinModal, setShowPinModal] = useState(false);
      const [pin, setPin] = useState('');
      const [pinError, setPinError] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        const inputPin = String(pin).trim();
        const mainPin = String(teacherPin).trim();
        const subPin = subTeacherPin ? String(subTeacherPin).trim() : '';

        if (inputPin === mainPin || (subPin !== '' && inputPin === subPin)) {
          setView('teacher');
        } else {
          setPinError('비밀번호가 일치하지 않습니다.');
        }
      };

      return (
        <div className="flex flex-col items-center justify-center min-h-screen px-4 py-8 relative overflow-hidden bg-gradient-to-br from-indigo-50 via-white to-blue-50">
          
          {/* 배경 장식 효과 */}
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>

          <div className="text-center mb-12 relative z-10 fade-in">
            <h1 className="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight mb-3">온라인 자기소개서</h1>
            <p className="text-slate-500 font-medium text-sm md:text-base">원하시는 메뉴를 선택해주세요.</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl relative z-10 fade-in" style={{ animationDelay: '0.1s' }}>
            <button onClick={() => setView('student')} className="group flex flex-col items-center justify-center p-10 md:p-12 bg-white/80 backdrop-blur-md rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 hover:shadow-xl hover:-translate-y-1 hover:border-indigo-100 transition-all duration-300">
              <div className="w-20 h-20 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 group-hover:bg-indigo-100 transition-transform duration-300 shadow-sm">🎓</div>
              <h2 className="text-xl font-bold text-slate-800 mb-2">학생입니다</h2>
              <p className="text-sm text-slate-500">나의 이야기를 작성하고 제출합니다.</p>
            </button>
            <button onClick={() => setShowPinModal(true)} className="group flex flex-col items-center justify-center p-10 md:p-12 bg-white/80 backdrop-blur-md rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 hover:shadow-xl hover:-translate-y-1 hover:border-blue-100 transition-all duration-300">
              <div className="w-20 h-20 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center text-4xl mb-6 group-hover:scale-110 group-hover:bg-blue-100 transition-transform duration-300 shadow-sm">💼</div>
              <h2 className="text-xl font-bold text-slate-800 mb-2">선생님입니다</h2>
              <p className="text-sm text-slate-500">제출된 자기소개서를 관리합니다.</p>
            </button>
          </div>

          {showPinModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-in">
              <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-sm p-8 border border-slate-100 transform transition-all">
                <div className="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-6 shadow-inner border border-slate-100">🔒</div>
                <h3 className="text-2xl font-bold text-center text-slate-800 mb-2">선생님 확인</h3>
                <p className="text-sm text-center text-slate-500 mb-8 leading-relaxed">학생들의 데이터를 보호하기 위해<br/>비밀번호를 입력해주세요.</p>
                <form onSubmit={handleLogin}>
                  <input type="password" autoFocus value={pin} onChange={(e) => {setPin(e.target.value); setPinError('');}} placeholder="비밀번호 입력" className="w-full px-5 py-4 bg-slate-50 rounded-2xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none mb-3 text-center text-2xl tracking-[0.5em] font-mono transition-all" />
                  {pinError && <p className="text-rose-500 text-xs text-center mb-4 font-medium">{pinError}</p>}
                  <div className="flex space-x-3 mt-6">
                    <button type="button" onClick={() => {setShowPinModal(false); setPin('');}} className="flex-1 py-4 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 active:scale-95 transition-all">취소</button>
                    <button type="submit" className="flex-1 py-4 bg-slate-800 text-white rounded-xl font-bold shadow-md hover:bg-slate-900 hover:shadow-lg active:scale-95 transition-all">확인</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 학생 폼 (깔끔한 입력 모달 디자인)
    // ==========================================
    function StudentForm({ onSubmit, onBack, isSubmitting }) {
      const [formData, setFormData] = useState({});

      const handleChange = (e) => {
        setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 fade-in">
          <button onClick={onBack} className="group flex items-center text-slate-500 hover:text-indigo-600 mb-8 font-semibold transition-colors">
            <span className="mr-2 px-2 py-1 bg-white rounded-lg shadow-sm border border-slate-200 group-hover:border-indigo-200 transition-colors">⬅</span> 
            처음으로 돌아가기
          </button>
          
          <div className="bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden relative">
            
            {/* 세련된 그라데이션 헤더 */}
            <div className="bg-gradient-to-r from-indigo-600 to-blue-600 px-8 py-10 md:py-12 text-white relative overflow-hidden">
              <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
              <h2 className="text-2xl md:text-3xl font-extrabold mb-3 relative z-10 tracking-tight">나를 소개합니다 👋</h2>
              <p className="text-indigo-100 text-sm md:text-base font-medium relative z-10 opacity-90">선생님이 여러분을 더 잘 이해할 수 있도록 편안하게 작성해 주세요!</p>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSubmit(formData); }} className="p-6 md:p-10 space-y-12">
              {CATEGORIES.map(category => (
                <div key={category} className="space-y-6">
                  <div className="flex items-center border-b border-slate-100 pb-3">
                    <div className="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mr-3 font-bold text-sm">✓</div>
                    <h3 className="text-lg font-bold text-slate-800 tracking-tight">{category}</h3>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 pl-1 md:pl-2">
                    {FORM_FIELDS.filter(f => f.category === category).map((field) => (
                      <div key={field.id} className={field.type === 'textarea' ? 'md:col-span-2' : ''}>
                        <label className="block text-sm font-semibold text-slate-700 mb-2 ml-1">{field.label}</label>
                        {field.type === 'textarea' ? (
                          <textarea name={field.id} required placeholder={field.placeholder} onChange={handleChange} className="w-full px-5 py-4 bg-slate-50/50 rounded-2xl border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none h-32 resize-none placeholder-slate-400 text-slate-800 transition-all"></textarea>
                        ) : (
                          <input type={field.type} name={field.id} required placeholder={field.placeholder} onChange={handleChange} className="w-full px-5 py-4 bg-slate-50/50 rounded-2xl border border-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none placeholder-slate-400 text-slate-800 transition-all" />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
              
              <div className="pt-8 pb-4">
                <button type="submit" disabled={isSubmitting} className={`w-full bg-slate-800 text-white font-bold py-5 rounded-2xl shadow-lg hover:bg-slate-900 hover:shadow-xl active:scale-[0.98] transition-all text-lg tracking-wide ${isSubmitting ? 'opacity-70 cursor-not-allowed' : ''}`}>
                  {isSubmitting ? '안전하게 저장 중입니다...' : '선생님께 제출하기'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 제출 완료 화면
    // ==========================================
    function ThankYouView({ onHome }) {
      return (
        <div className="flex items-center justify-center min-h-screen px-4 fade-in">
          <div className="bg-white p-12 rounded-[2rem] shadow-xl border border-slate-100 text-center max-w-md w-full relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 to-emerald-500"></div>
            <div className="w-24 h-24 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-8 shadow-sm">🎉</div>
            <h2 className="text-2xl font-extrabold text-slate-800 mb-3 tracking-tight">제출이 완료되었습니다!</h2>
            <p className="text-slate-500 mb-10 leading-relaxed font-medium">소중한 이야기를 들려주어 고맙습니다.<br/>작성한 내용은 선생님만 안전하게 확인합니다.</p>
            <button onClick={onHome} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-4 rounded-xl font-bold active:scale-95 transition-all">처음 화면으로</button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 교사 대시보드 (노션 스타일의 깔끔한 뷰)
    // ==========================================
    function TeacherDashboard({ students, onBack, currentUrl, db }) {
      const [activeTab, setActiveTab] = useState('byStudent');
      
      return (
        <div className="flex flex-col h-screen bg-[#f8fafc] fade-in">
          {/* 모던 헤더 */}
          <header className="bg-white border-b border-slate-200 flex-none z-10 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-3 sm:h-16 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
              <div className="flex items-center space-x-4 w-full sm:w-auto">
                <button onClick={onBack} className="p-2 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-xl border border-slate-200 transition-colors">⬅</button>
                <div className="flex flex-col sm:flex-row sm:items-center">
                  <h1 className="text-lg font-extrabold text-slate-800 tracking-tight">학급 대시보드</h1>
                  <span className="mt-1 sm:mt-0 sm:ml-3 px-3 py-1 bg-indigo-50 text-indigo-600 font-bold rounded-lg text-xs border border-indigo-100 flex items-center w-max">
                    <span className="w-2 h-2 rounded-full bg-indigo-500 mr-2 animate-pulse"></span>총 {students.length}명
                  </span>
                </div>
              </div>
              
              <div className="flex space-x-1.5 bg-slate-100 p-1.5 rounded-xl text-sm hide-scrollbar overflow-x-auto w-full sm:w-auto border border-slate-200">
                {['byStudent', 'byQuestion', 'qr', 'settings'].map(tab => {
                  const titles = { byStudent: '학생별', byQuestion: '문항별', qr: 'QR배포', settings: '설정/백업' };
                  const isActive = activeTab === tab;
                  return (
                    <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-lg whitespace-nowrap font-bold transition-all duration-200 ${isActive ? 'bg-white text-indigo-700 shadow-sm border border-slate-200/60' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}>
                      {titles[tab]}
                    </button>
                  );
                })}
              </div>
            </div>
          </header>
          
          <main className="flex-1 overflow-hidden relative">
            {activeTab === 'byStudent' && <ViewByStudent students={students} db={db} />}
            {activeTab === 'byQuestion' && <ViewByQuestion students={students} />}
            {activeTab === 'qr' && <ViewQRCode url={currentUrl} />}
            {activeTab === 'settings' && <ViewSettings db={db} students={students} />}
          </main>
        </div>
      );
    }

    // --- 교사: 학생별 보기 (사이드바 + 메인콘텐츠) ---
    function ViewByStudent({ students, db }) {
      const [selId, setSelId] = useState(null); 
      const [isEdit, setIsEdit] = useState(false);
      const [editData, setEditData] = useState({});
      const student = students.find(s => s.id === selId);

      useEffect(() => { setIsEdit(false); }, [selId]);

      const handleSave = async () => {
        try {
          await window.firebase.updateDoc(window.firebase.doc(db, 'student_introductions', selId), editData);
          setIsEdit(false);
        } catch (e) { alert("저장 실패"); }
      };

      const handleDel = async () => {
        if(confirm(`${student.name} 학생의 데이터를 삭제하시겠습니까?`)) {
          await window.firebase.deleteDoc(window.firebase.doc(db, 'student_introductions', selId));
          setSelId(null);
        }
      };

      const escapeCsv = (str) => {
        let s = String(str).replace(/"/g, '""');
        if (s.includes(',') || s.includes('\n') || s.includes('"')) s = `"${s}"`;
        return s;
      };

      return (
        <div className="flex flex-col md:flex-row h-full">
          {/* 학생 명단 사이드바 */}
          <div className={`w-full md:w-72 bg-white border-r border-slate-200 flex-none overflow-y-auto smooth-scroll ${selId ? 'hidden md:flex md:flex-col' : 'flex flex-col'}`}>
            <div className="p-4">
              <div className="text-xs font-bold text-slate-400 mb-3 pl-2 tracking-wider">STUDENT LIST</div>
              <div className="space-y-1">
                {students.map(s => {
                  const isActive = selId === s.id;
                  return (
                    <button key={s.id} onClick={() => setSelId(s.id)} className={`w-full text-left px-4 py-3.5 rounded-xl flex justify-between items-center transition-all ${isActive ? 'bg-indigo-50 text-indigo-700 font-bold border border-indigo-100 shadow-sm' : 'text-slate-600 font-medium hover:bg-slate-50 border border-transparent'}`}>
                      <span>{s.name}</span>
                      <span className={`text-xs ${isActive ? 'text-indigo-400' : 'text-slate-300 md:hidden'}`}>❯</span>
                    </button>
                  )
                })}
              </div>
            </div>
          </div>

          {/* 메인 뷰 */}
          <div className={`flex-1 overflow-y-auto p-4 sm:p-8 smooth-scroll ${!selId ? 'hidden md:block' : 'block'}`}>
            {!student ? (
              <div className="h-full hidden md:flex flex-col items-center justify-center text-slate-400">
                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-2xl mb-4">📄</div>
                <p className="font-medium">왼쪽 목록에서 학생을 선택해주세요.</p>
              </div>
            ) : (
              <div className="max-w-4xl mx-auto space-y-6 fade-in">
                <button onClick={() => setSelId(null)} className="md:hidden mb-2 px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 shadow-sm">⬅ 목록으로</button>
                
                {/* 상단 컨트롤 바 */}
                <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-6">
                  {isEdit ? (
                    <input className="text-3xl font-extrabold border-b-2 border-indigo-500 outline-none w-full sm:w-48 bg-slate-50 p-2 rounded-t-lg text-slate-800" value={editData.name || ''} onChange={e=>setEditData({...editData, name: e.target.value})} placeholder="이름" />
                  ) : (
                    <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">{student.name}</h2>
                  )}
                  
                  <div className="flex gap-2 w-full sm:w-auto">
                    {!isEdit && (
                      <button onClick={() => {
                        let csvContent = "data:text/csv;charset=utf-8,\uFEFF카테고리,문항,답변(기본/하이픈O),답변(하이픈X),추가정보(텍스트)\n";
                        FORM_FIELDS.forEach(f => {
                          let ans1 = student[f.id] || "미작성", ans2 = "", extra = "";
                          if (f.id === 'emergency' || f.id === 'contact') {
                            const extracted = extractPhoneAndText(ans1, student.name);
                            ans1 = extracted.phoneHyphen; ans2 = extracted.phoneNoHyphen; extra = extracted.relation;
                          }
                          csvContent += `${escapeCsv(f.category)},${escapeCsv(f.label)},${escapeCsv(ans1)},${escapeCsv(ans2)},${escapeCsv(extra)}\n`;
                        });
                        csvContent += `교사 전용,교사 상담 메모,${escapeCsv(student.teacherNote || "기록 없음")},,\n`;
                        const link = document.createElement("a");
                        link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `${student.name}_자기소개서.csv`);
                        document.body.appendChild(link); link.click(); document.body.removeChild(link);
                      }} className="flex-1 sm:flex-none px-4 py-2.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-xl text-sm font-bold border border-emerald-200 transition-colors">📊 엑셀</button>
                    )}
                    {isEdit ? (
                      <>
                        <button onClick={()=>setIsEdit(false)} className="flex-1 sm:flex-none px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-200">취소</button>
                        <button onClick={handleSave} className="flex-1 sm:flex-none px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 shadow-sm">저장</button>
                      </>
                    ) : (
                      <>
                        <button onClick={()=>{setEditData({...student}); setIsEdit(true);}} className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-800 text-white rounded-xl text-sm font-bold shadow-sm hover:bg-slate-900 transition-colors">✏️ 수정</button>
                        <button onClick={handleDel} className="flex-1 sm:flex-none px-4 py-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl text-sm font-bold border border-rose-200 transition-colors">🗑️ 삭제</button>
                      </>
                    )}
                  </div>
                </div>

                {/* 교사 메모 영역 */}
                <div className="bg-amber-50/80 p-6 md:p-8 rounded-[2rem] border border-amber-200 shadow-sm">
                  <h3 className="font-extrabold text-amber-800 mb-3 text-sm flex items-center">
                    <span className="w-6 h-6 bg-amber-200/50 rounded-lg flex items-center justify-center mr-2 text-xs">📝</span> 교사 상담 메모 (비공개)
                  </h3>
                  {isEdit ? (
                    <textarea value={editData.teacherNote||''} onChange={e=>setEditData({...editData, teacherNote: e.target.value})} className="w-full p-4 rounded-xl border border-amber-300 focus:ring-4 focus:ring-amber-500/20 outline-none text-sm bg-white text-slate-800 transition-all" rows="3" placeholder="메모를 입력하세요..."></textarea>
                  ) : (
                    <div className="bg-white p-5 rounded-xl text-sm text-slate-700 whitespace-pre-wrap leading-relaxed shadow-sm border border-amber-100 min-h-[4rem]">{student.teacherNote || <span className="text-amber-700/40 italic">기록된 메모가 없습니다.</span>}</div>
                  )}
                </div>

                {/* 응답 내용 영역 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {CATEGORIES.map(category => (
                    <div key={category} className={`bg-white p-6 md:p-8 rounded-[2rem] border border-slate-200 shadow-sm ${category==='소통'?'md:col-span-2':''}`}>
                      <h3 className="font-extrabold text-slate-800 mb-6 flex items-center">
                        <span className="w-2 h-6 bg-indigo-500 rounded-full mr-3"></span>{category}
                      </h3>
                      <div className="space-y-5">
                        {FORM_FIELDS.filter(f=>f.category===category).map(f => (
                          <div key={f.id} className="group">
                            <div className="text-xs font-bold text-slate-400 mb-1.5 ml-1">{f.label}</div>
                            {isEdit ? ( 
                              f.type === 'textarea' ? <textarea value={editData[f.id]||''} onChange={e=>setEditData({...editData, [f.id]:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none text-sm transition-all text-slate-800" rows="3" /> 
                              : <input value={editData[f.id]||''} onChange={e=>setEditData({...editData, [f.id]:e.target.value})} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 outline-none text-sm transition-all text-slate-800" /> 
                            ) : (
                              <div className="px-4 py-3 bg-slate-50 rounded-xl text-sm text-slate-700 whitespace-pre-wrap leading-relaxed border border-slate-100 group-hover:bg-slate-100/50 transition-colors">
                                {(f.id === 'emergency') ? (formatEmergencyContact(student[f.id], student.name) || <span className="text-slate-400">미작성</span>) : (f.id === 'contact') ? (formatPhoneNumberDisplay(student[f.id]) || <span className="text-slate-400">미작성</span>) : (student[f.id] || <span className="text-slate-400">미작성</span>)}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 교사: 문항별 보기 ---
    function ViewByQuestion({ students }) {
      const [selField, setSelField] = useState(FORM_FIELDS[15].id); // 비밀고민
      
      const handleDownloadExcel = () => {
        if (!students.length) return alert("데이터가 없습니다.");
        const fieldName = FORM_FIELDS.find(f => f.id === selField)?.label || '데이터';
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF이름," + ((selField === 'emergency' || selField === 'contact') ? "번호(O),번호(X),추가정보\n" : `${fieldName}\n`); 

        students.forEach(s => {
          let ans = s[selField] || "미작성";
          if (selField === 'emergency' || selField === 'contact') {
            const ext = extractPhoneAndText(ans, s.name);
            csvContent += `"${s.name}","${ext.phoneHyphen}","${ext.phoneNoHyphen}","${ext.relation}"\n`;
          } else {
            csvContent += `"${s.name}","${String(ans).replace(/"/g, '""')}"\n`;
          }
        });
        const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `우리반_${fieldName}.csv`);
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      return (
        <div className="h-full flex flex-col p-4 md:p-8 max-w-6xl mx-auto fade-in">
          <div className="bg-white rounded-[2rem] shadow-sm border border-slate-200 p-6 mb-8 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
            <div className="w-full md:flex-1">
              <label className="block text-xs font-bold text-slate-400 mb-2 ml-1">조회할 문항 선택</label>
              <select value={selField} onChange={e=>setSelField(e.target.value)} className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-slate-700 focus:ring-4 focus:ring-indigo-500/10 transition-all appearance-none cursor-pointer">
                {FORM_FIELDS.map(f => <option key={f.id} value={f.id}>[{f.category}] {f.label}</option>)}
              </select>
            </div>
            <button onClick={handleDownloadExcel} className="w-full md:w-auto px-6 py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold whitespace-nowrap shadow-sm md:self-end active:scale-95 transition-all">
              📊 현재 문항 엑셀 저장
            </button>
          </div>

          <div className="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-8 smooth-scroll">
            {students.length === 0 && <div className="col-span-full text-center py-20 text-slate-400 font-medium">제출된 데이터가 없습니다.</div>}
            {students.map(s => (
              <div key={s.id} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                <div className="font-extrabold text-indigo-700 mb-3 text-lg flex items-center">
                  <div className="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mr-2 text-sm">👤</div>
                  {s.name}
                </div>
                <div className="text-slate-600 text-sm whitespace-pre-wrap leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100 min-h-[5rem]">
                  {(selField === 'emergency') ? formatEmergencyContact(s[selField], s.name) : (selField === 'contact') ? formatPhoneNumberDisplay(s[selField]) : (s[selField] || <span className="text-slate-300 italic">미작성</span>)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- 교사: QR 코드 ---
    function ViewQRCode({ url }) {
      const [customUrl, setCustomUrl] = useState(url.split('?')[0].replace('index.html', ''));
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(customUrl)}`;
      return (
        <div className="h-full flex items-center justify-center p-6 fade-in">
          <div className="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100 text-center max-w-md w-full relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
            <h2 className="text-2xl font-extrabold text-slate-800 mb-8 mt-2">학생 배포용 QR</h2>
            <div className="bg-slate-50 p-6 rounded-3xl inline-block border border-slate-100 mb-8 shadow-inner">
              <img src={qrUrl} className="w-48 h-48 mix-blend-darken" alt="QR Code" />
            </div>
            <div className="text-left mb-2 ml-1 text-xs font-bold text-slate-400">접속 주소 확인/수정</div>
            <input value={customUrl} onChange={e=>setCustomUrl(e.target.value)} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-sm text-slate-600 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all font-mono" />
            <p className="text-xs text-slate-400 font-medium">위 주소를 변경하면 QR 코드도 즉시 바뀝니다.</p>
          </div>
        </div>
      );
    }

    // --- 교사: 설정 및 백업 ---
    function ViewSettings({ db, students }) {
      const [pin1, setPin1] = useState(''); const [pin2, setPin2] = useState('');
      const [subPin1, setSubPin1] = useState(''); const [subPin2, setSubPin2] = useState('');

      const handleSaveMain = async (e) => {
        e.preventDefault();
        if(pin1!==pin2 || pin1.length<4) return alert("비밀번호 불일치 또는 4자리 미만");
        await window.firebase.setDoc(window.firebase.doc(db, 'settings', 'app_settings'), {pin: String(pin1).trim()}, { merge: true });
        alert("담임 비밀번호 변경 완료"); setPin1(''); setPin2('');
      };

      const handleSaveSub = async (e) => {
        e.preventDefault();
        if(subPin1!==subPin2 || subPin1.length<4) return alert("비밀번호 불일치 또는 4자리 미만");
        await window.firebase.setDoc(window.firebase.doc(db, 'settings', 'app_settings'), {subPin: String(subPin1).trim()}, { merge: true });
        alert("부담임 비밀번호 설정 완료"); setSubPin1(''); setSubPin2('');
      };

      const handleFullBackup = () => {
        if (!students || students.length === 0) return alert("백업할 데이터가 없습니다.");

        const currentFields = FORM_FIELDS.map(f => f.id);
        const headers = ["id", ...currentFields, "teacherNote", "createdAt"];
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += headers.join(",") + "\n";

        students.forEach(student => {
          const row = headers.map(header => {
            let val = student[header] || "";
            if (header === 'createdAt' && typeof val === 'number') {
              val = new Date(val).toLocaleString(); 
            }
            val = String(val).replace(/"/g, '""');
            if (val.includes(',') || val.includes('\n') || val.includes('"')) {
              val = `"${val}"`;
            }
            return val;
          });
          csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `자기소개서_구글시트이사_전체백업.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="p-6 md:p-12 flex flex-col items-center h-full overflow-y-auto smooth-scroll space-y-8 fade-in">
          
          <div className="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-sm border border-indigo-100 max-w-lg w-full relative overflow-hidden">
            <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-50 rounded-full blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
            <h2 className="font-extrabold text-2xl mb-3 text-slate-800 relative z-10 flex items-center"><span className="text-indigo-500 mr-2 text-3xl">💾</span> 데이터 안전 백업</h2>
            <p className="text-sm text-slate-500 mb-8 leading-relaxed relative z-10 font-medium">
              모든 학생들의 자기소개서와 선생님의 비밀 메모를 한 번에 다운로드합니다. 이 파일을 구글 시트에 붙여넣어 평생 보관하세요!
            </p>
            <button onClick={handleFullBackup} className="w-full p-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg shadow-md hover:shadow-lg active:scale-95 transition-all relative z-10">
              📥 전체 데이터 다운로드 (CSV)
            </button>
          </div>

          <form onSubmit={handleSaveMain} className="bg-white p-8 md:p-10 rounded-[2.5rem] shadow-sm border border-slate-200 max-w-lg w-full space-y-5">
            <h2 className="font-extrabold text-2xl mb-6 text-slate-800 flex items-center"><span className="text-emerald-500 mr-2 text-3xl">👑</span> 담임 비밀번호 변경</h2>
            <div>
              <label className="block text-xs font-bold text-slate-400 mb-2 ml-1">새 비밀번호</label>
              <input type="password" value={pin1} onChange={e=>setPin1(e.target.value)} placeholder="4자리 이상" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all font-mono tracking-widest text-lg" />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-400 mb-2 ml-1">비밀번호 확인</label>
              <input type="password" value={pin2} onChange={e=>setPin2(e.target.value)} placeholder="다시 한 번 입력" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all font-mono tracking-widest text-lg" />
            </div>
            <button className="w-full p-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold mt-2 shadow-sm active:scale-95 transition-all">설정 저장하기</button>
          </form>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
